<!doctype html>
<!-- CHANGELOG
2026-10-07  v1  Review-before-commit modal: Vehicles / New Subtypes / Conflicts / Errors tabs, near-match "Use X instead", Import button gated on conflicts.
2026-10-20  v2  Simplified per SCP Priming Session 2026-10-08. The import no longer creates subtypes, so New Subtypes, Conflicts, near-match and the Is Add-on column are gone.
                No review step: upload imports valid rows immediately and this modal shows the results (Imported / Errors) with the error-file download.
                Element ID prefix changed vehicle-import-review-* -> vehicle-import-results-*. Mock control added to switch scenarios.
2026-10-20  v2.1 Tables list every row and stop growing at 12 rows; past that the table scrolls with a fixed header. Removed the "… N more rows" line.
2026-10-20  v2.2 Summary copy: "Download and review the error file." replaces "fix the rows and upload it again".
2026-10-20  v2.3 Stat cards removed (the banner and tab labels already carry the counts). Missing-subtype error drops "then upload this row again".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Import Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens read from Figma M09kEEo1KNu48sLPl3b2av node 1213:6778 (SCP Design System), re-checked 2026-10-20 */
:root{
  --navy:#20315A; --navy-dark:#242833; --green:#33A542; --page:#FAFAFC; --white:#FFFFFF;
  --border:#E5E7EB; --accordion:#EAEDF2; --stat-active:#EEF1F8;
  --seg-bg:#E0E1E8; --scheduled:#0066A6; --muted:#888888;
  /* Status colours for alerts: not given as hex in the node — placeholders, match live app */
  --info:#0066A6; --success:#33A542; --warning:#D97706; --error:#DC2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,sans-serif;background:var(--page);color:var(--navy-dark);font-size:14px}
.topnav{height:70px;background:var(--navy-dark);display:flex;align-items:center;padding:0 24px;gap:40px;overflow-x:auto}
.topnav .logo{color:#fff;font-weight:600;font-size:18px;width:140px;flex-shrink:0}
.topnav a{color:rgba(255,255,255,.8);text-decoration:none;font-size:15px;font-weight:500;height:70px;display:flex;align-items:center;border-bottom:4px solid transparent}
.topnav a.active{border-bottom-color:var(--green);color:#fff}
.subnav{height:48px;background:#fff;display:flex;align-items:center;gap:24px;padding:0 32px;border-bottom:1px solid var(--border);overflow-x:auto}
.subnav a{font-size:16px;color:var(--navy-dark);text-decoration:none;height:48px;display:flex;align-items:center;border-bottom:3px solid transparent}
.subnav a.active{color:var(--green);border-bottom-color:var(--green)}
.page{padding:24px 32px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:28px;font-weight:600;color:var(--navy);margin:0}
.btn{font-family:inherit;font-size:14px;border-radius:5px;padding:8px 30px;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff;border:1px solid var(--navy)}
.btn-secondary{background:transparent;color:var(--navy);border:1px solid var(--navy)}
/* Mock-only scenario switcher */
.mockbar{position:fixed;left:16px;bottom:16px;z-index:10;background:#fff;border:1px dashed var(--muted);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mockbar button{font-family:inherit;font-size:12px;border:1px dashed var(--muted);background:#fff;border-radius:4px;padding:4px 10px;cursor:pointer}
.mockbar button.on{border-style:solid;border-color:var(--navy);color:var(--navy)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(36,40,51,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.overlay.hidden{display:none}
.modal{background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.2);width:100%;max-width:880px}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border)}
.modal-header h2{margin:0;font-size:18px;font-weight:600;color:var(--navy)}
.modal-header .file{font-size:12px;font-weight:300;color:var(--muted);margin-top:4px}
.close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--navy-dark)}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:15px 24px;border-top:1px solid var(--border)}
/* Segmented tabs */
.seg{display:inline-flex;background:var(--seg-bg);border-radius:20px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:none;background:transparent;font-family:inherit;font-size:14px;padding:9px 16px;border-radius:20px;cursor:pointer;color:var(--navy-dark)}
.seg button.active{background:var(--navy);color:#fff}
/* Alerts */
.alert{position:relative;padding:12px 16px 12px 19px;font-size:13px;border-radius:0 4px 4px 0;margin-bottom:14px;line-height:1.45}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.alert.success{background:rgba(51,165,66,.09)} .alert.success::before{background:var(--success)}
.alert.warning{background:rgba(217,119,6,.09)} .alert.warning::before{background:var(--warning)}
.alert.error{background:rgba(220,38,38,.08)} .alert.error::before{background:var(--error)}
/* Table */
.table-wrap{border:1px solid var(--border);border-radius:5px;overflow:auto;background:#fff;max-height:509px}
/* 509px = 40px header + 12 rows x 39px + 1px border: the table shows 12 rows, then scrolls */
thead th{position:sticky;top:0;background:#fff;z-index:1}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:10px;font-weight:700;text-align:left;padding:13px 10px;border-bottom:1px solid var(--border);letter-spacing:.3px;white-space:nowrap}
td{font-size:14px;font-weight:300;padding:10px;height:39px;border-bottom:1px solid var(--border)}
tr:nth-child(even) td{background:var(--page)}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:12px;font-weight:300;padding:3px 8px;border-radius:12px;white-space:nowrap}
.badge.addon{background:rgba(51,165,66,.12);color:#23802F}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.panel{display:none} .panel.active{display:block}
@media (max-width:600px){.topnav{gap:16px;padding:0 16px}.topnav .logo{width:auto}.subnav{padding:0 16px}.page{padding:16px}.modal-body{padding:16px}.modal-footer{flex-direction:column-reverse;align-items:stretch}}
</style>
</head>
<body>
<nav class="topnav"><span class="logo">⬡ Routeware</span><a href="#">DISPATCH</a><a href="#">CUSTOMERS</a><a href="#" class="active">FLEET</a><a href="#">INSIGHTS</a></nav>
<div class="subnav"><a href="#" class="active">Vehicles</a><a href="#">Resources</a><a href="#">Devices</a></div>
<main class="page">
  <div class="page-head">
    <h1>Vehicles</h1>
    <!-- Existing button. Keep this id: it is already tagged in Pendo. -->
    <button class="btn btn-secondary" id="vehicle-import-button">Import</button>
  </div>
  <div class="mockbar">Mock scenario:
    <button data-scn="mixed" class="on">Some rows failed</button>
    <button data-scn="clean">All rows imported</button>
    <button data-scn="none">No rows imported</button>
  </div>
</main>

<div class="overlay" id="vehicle-import-results-modal-overlay">
<div class="modal" role="dialog" aria-labelledby="vehicle-import-results-title" id="vehicle-import-results-modal">
  <div class="modal-header">
    <div><h2 id="vehicle-import-results-title">Vehicle Import Results</h2><div class="file" id="vehicle-import-results-file">Vehicle Upload Template.xlsx · 26 rows</div></div>
    <button class="close" id="vehicle-import-results-close-button" aria-label="Close">×</button>
  </div>

  <div class="modal-body">
    <div class="alert" id="vehicle-import-results-summary"></div>

    <div class="seg" role="tablist">
      <button class="active" id="vehicle-import-results-tab-imported" data-tab="imported">Imported</button>
      <button id="vehicle-import-results-tab-errors" data-tab="errors">Errors</button>
    </div>

    <section class="panel active" id="vehicle-import-results-panel-imported">
      <div class="table-wrap"><table id="vehicle-import-results-imported-table">
        <thead><tr><th>ROW</th><th>VEHICLE NAME</th><th>VEHICLE TYPE</th><th>VEHICLE SUBTYPE</th><th>ADD-ON</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section class="panel" id="vehicle-import-results-panel-errors">
      <div class="table-wrap"><table id="vehicle-import-results-errors-table">
        <thead><tr><th>ROW</th><th>VEHICLE NAME</th><th>FIELD</th><th>PROBLEM</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" id="vehicle-import-results-download-errors-button">Download error file</button>
    <button class="btn btn-primary" id="vehicle-import-results-done-button">Done</button>
  </div>
</div>
</div>

<script>
(function(){
  // Sample data. Add-on is read from the subtype's saved setting, not from the file.
  const imported=[
    [2,'FL-101','Front Load','Rear Loader XL',false],
    [3,'FL-102','Front Load','Front Load',false],
    [4,'FL-103','Front Load','Rear Loader XL',false],
    [5,'RO-201','Roll off','Compactor',false],
    [6,'TR-01','Roll off','Pup Trailer',true],
    [7,'TR-02','Roll off','Pup Trailer',true],
    [8,'SP-01','Snow Plow','Wing Plow',true],
    [11,'RES-303','Residential','Grappler',false],
    [12,'RES-304','Residential','Grappler',false],
    [13,'RES-305','Residential','Side Load',false],
    [14,'RES-306','Residential','Batch Side Load',false],
    [15,'RES-307','Residential','Batch Side Load',false],
    [16,'FL-104','Front Load','Front Load',false],
    [17,'FL-105','Front Load','Rear Loader XL',false],
    [18,'RO-202','Roll off','Compactor',false],
    [20,'RO-203','Roll off','Hook Lift',false],
    [21,'TR-03','Roll off','Pup Trailer',true],
    [22,'SP-02','Snow Plow','Front Plow',false],
    [23,'SP-03','Snow Plow','Wing Plow',true],
    [24,'SW-01','Street Sweeper','Mechanical Broom',false],
    [25,'SW-02','Street Sweeper','Regenerative Air',false],
    [26,'SW-03','Street Sweeper','Regenerative Air',false]
  ];
  const importedAll=imported.concat([[27,'RES-308','Residential','Side Load',false],[28,'FL-106','Front Load','Front Load',false]]);
  const errors=[
    [9,'RES-301','Vehicle Subtype','"Grapler" is not a Residential subtype. Create it on Configure Vehicle Subtypes.'],
    [10,'RES-302','Unavailable End Date','Must be on or after Unavailable Start Date'],
    [19,'—','Vehicle Name','Required when adding a new vehicle']
  ];
  const scenarios={
    mixed:{imported:22,shown:imported,errors:errors,rows:25},
    clean:{imported:24,shown:importedAll,errors:[],rows:24},
    none:{imported:0,shown:[],errors:errors,rows:3}
  };
  const $=id=>document.getElementById(id);
  const tabs=['imported','errors'];
  function show(t){
    tabs.forEach(n=>{
      $('vehicle-import-results-panel-'+n).classList.toggle('active',n===t);
      $('vehicle-import-results-tab-'+n).classList.toggle('active',n===t);
    });
  }
  function render(key){
    const s=scenarios[key], e=s.errors.length;
    $('vehicle-import-results-file').textContent='Vehicle Upload Template.xlsx · '+s.rows+' rows';
    $('vehicle-import-results-tab-imported').textContent='Imported ('+s.imported+')';
    $('vehicle-import-results-tab-errors').textContent='Errors ('+e+')';
    const sum=$('vehicle-import-results-summary');
    if(s.imported&&!e){sum.className='alert success';sum.textContent=s.imported+' vehicles imported.';}
    else if(s.imported){sum.className='alert warning';sum.textContent=s.imported+' vehicles imported. '+e+' rows weren’t imported. Download and review the error file.';}
    else{sum.className='alert error';sum.textContent='No vehicles imported. Download and review the error file.';}
    const ib=$('vehicle-import-results-imported-table').querySelector('tbody');
    ib.innerHTML=s.shown.length
      ? s.shown.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+(r[4]?'<span class="badge addon">Yes</span>':'No')+'</td></tr>').join('')
      : '<tr><td colspan="5" class="empty">No vehicles were imported from this file.</td></tr>';
    const eb=$('vehicle-import-results-errors-table').querySelector('tbody');
    eb.innerHTML=e
      ? s.errors.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')
      : '<tr><td colspan="4" class="empty">Every row imported.</td></tr>';
    $('vehicle-import-results-download-errors-button').style.display=e?'':'none';
    show(s.imported?'imported':'errors');
    $('vehicle-import-results-modal-overlay').classList.remove('hidden');
  }
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
  document.querySelectorAll('[data-scn]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-scn]').forEach(x=>x.classList.toggle('on',x===b)); render(b.dataset.scn);
  }));
  const close=()=>$('vehicle-import-results-modal-overlay').classList.add('hidden');
  $('vehicle-import-results-close-button').addEventListener('click',close);
  $('vehicle-import-results-done-button').addEventListener('click',close);
  $('vehicle-import-button').addEventListener('click',()=>render(document.querySelector('[data-scn].on').dataset.scn));
  render('mixed');
})();
</script>
</body>
</html>
