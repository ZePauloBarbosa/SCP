:"In",why:"Odakyu's attribute panel, field for field.",source:"Ryan 08-25"},{id:"active",area:"Network",feature:"Active / inactive: inactive stays on the map in red and is kept out of sequencing and path generation",status:"In",why:'Odakyu: "does it go to the sequencing algorithm".',source:"Ryan 08-25 · Paulo 08-26"},{id:"non-drivable",area:"Network",feature:"Display as non-drivable: red here and on the driver's route map; kept out of the algorithm",status:"In",why:"Built for Odakyu; the app overlays it on street data.",source:"Ryan 08-25"},{id:"classification",area:"Network",feature:"Classification shown and edited as High / Medium / Low instead of FleetRoute's 1–20",status:"In",why:"Paulo chose the grouped display. The mapping of groups to FleetRoute classes is agreed with Optimization before build.",source:"Ryan 08-25 · Paulo 10-09"},{id:"split-add",area:"Network",feature:"Split segment; add segment from a node (snap to node or segment)",status:"In",why:"Both in Odakyu. A new segment joins the network on the next build.",source:"Ryan 08-25"},{id:"bulk-edit",area:"Network",feature:"Shift-click and Select area; bulk edit of status, drivable, classification, direction, speed with Mixed values",status:"In",why:"New UI with no Optimization dependency. Paulo kept it in Phase 1.",source:"Paulo 10-09"},{id:"osm-tags",area:"Network",feature:"OSM tags shown read-only on the segment",status:"In",why:"Data SmartCity already imports.",source:"Paulo 10-09"},{id:"not-in-phase1",area:"Network",feature:"Delete segment",status:"Out",why:"Optimization is building it (OPT-686, Ollie, Ready for Development). Non-drivable covers the Phase 1 need.",source:"Paulo 10-09"},{id:"turn-rules",area:"Network",feature:"Turn restriction / penalty / schedule rule; roundabout and U-turn point",status:"Out",why:"Exists in FleetRoute, never exposed; needs an Optimization API and an agreed data model.",source:"Ryan 08-25"},{id:"vehicle-limits",area:"Network",feature:"Vehicle-type restriction (height
